[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskiwasi-plugin-remaju"
version = "0.3.2"
description = "Plugin REMAJU para Chaskiwasi 0.4.x; refuerzo de validación de roles y órdenes de cartel."
requires-python = ">=3.10"
dependencies = [
    "chaskiwasi>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaskiwasi_plugin_remaju"]

[project.entry-points."chaskiwasi.plugins"]
remaju = "chaskiwasi_plugin_remaju.config:Remates_Judiciales"

