[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskiwasi-plugin-remaju"
version = "0.2.1"
description = "Plugin REMAJU para Chaskiwasi."
requires-python = ">=3.10"
dependencies = [
    "chaskiwasi>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.entry-points."chaskiwasi.plugins"]
remaju = "chaskiwasi_plugin_remaju.plugin:create_plugin"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
